<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>That Girl OS 2027 — Free Demo</title>
<style>
:root{
--cream:#F8F2F4; --paper:#FFFCFD; --sand:#E9DCE3; --blush:#E2C6D2; --blush2:#F3E8EE;
--rose:#C49DB4; --mauve:#8E6385; --wine:#5B3557; --wine2:#704668;
--ink:#3B2737; --ink2:#6F5A69; --line:#E7DAE2; --gold:#8E6385;
--good:#7D9B76; --warn:#C77B58; --bad:#B4443C;
--card-shadow:0 6px 24px rgba(91,53,87,.07);
--radius:18px;
}
[data-theme="dark"]{
--cream:#211820; --paper:#2C202A; --sand:#382834; --blush:#47303F; --blush2:#3A2834;
--rose:#B98EAA; --mauve:#C7A0BA; --wine:#E2C6D2; --wine2:#DCBACD;
--ink:#F1E6EC; --ink2:#BBA4B3; --line:#44303E; --gold:#C49DB4;
--card-shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;background:var(--cream);color:var(--ink);font-size:15px;line-height:1.5}
h1,h2,h3,.serif{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:600;color:var(--wine)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--rose)}
textarea{resize:vertical;min-height:64px;width:100%}
a{color:var(--wine2)}
/* ---------- layout ---------- */
#app{display:flex;min-height:100vh}
#sidebar{width:248px;flex:0 0 248px;background:var(--wine);color:#F4EBF0;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 16px;z-index:40}
[data-theme="dark"] #sidebar{background:#36202F}
.logo{display:flex;align-items:center;gap:11px;padding:2px 6px 16px;border-bottom:1px solid rgba(255,255,255,.14)}
.logo-mark{width:42px;height:42px;border-radius:13px;background:var(--blush);display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:21px;color:var(--wine);font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.logo b{font-family:Georgia,serif;font-size:19px;letter-spacing:.4px;display:block;line-height:1.1}
.logo span{font-size:10.5px;opacity:.75;letter-spacing:1.6px;text-transform:uppercase}
#nav{flex:1;overflow-y:auto;padding:14px 0 8px;scrollbar-width:thin}
#nav button{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:#EEDFE8;text-align:left;padding:9px 12px;border-radius:11px;font-size:14px;margin-bottom:2px;transition:.15s}
#nav button:hover{background:rgba(255,255,255,.09)}
#nav button.on{background:rgba(226,198,210,.28);color:#fff;font-weight:600}
#nav button .ic{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 26px}
#nav button.on .ic{background:var(--blush);color:var(--wine)}
#nav svg{width:15px;height:15px}
.side-foot{border-top:1px solid rgba(255,255,255,.14);padding-top:12px;font-size:12px;opacity:.85}
.side-foot .who{display:flex;gap:9px;align-items:center}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blush);color:var(--wine);display:flex;align-items:center;justify-content:center;font-weight:700;font-family:Georgia,serif}
#main{flex:1;min-width:0;padding:0 30px 60px}
header.top{position:sticky;top:0;background:color-mix(in srgb,var(--cream) 88%,transparent);backdrop-filter:blur(8px);z-index:30;display:flex;align-items:center;gap:12px;padding:16px 0 12px;border-bottom:1px solid var(--line)}
header.top .ttl{flex:1;min-width:0}
header.top h1{font-size:24px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{font-size:12.5px;color:var(--ink2)}
.btn{background:var(--wine);color:#FCF6F9;border:0;border-radius:999px;padding:9px 17px;font-size:13.5px;font-weight:600;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--wine2)}
.btn.soft{background:var(--blush2);color:var(--wine);border:1.5px solid var(--blush)}
.btn.soft:hover{background:var(--blush)}
.btn.ghost{background:none;color:var(--wine);border:1.5px solid var(--line)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn.danger{background:none;color:var(--bad);border:1.5px solid var(--line)}
.iconbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:var(--wine);flex:0 0 38px}
.iconbtn svg{width:17px;height:17px}
#hamb{display:none}
.searchbox{position:relative}
.searchbox input{width:210px;border-radius:999px;padding-left:33px}
.searchbox svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink2)}
#searchResults{position:absolute;right:0;top:48px;width:340px;max-height:380px;overflow:auto;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;box-shadow:var(--card-shadow);padding:8px;display:none;z-index:60}
#searchResults .sr{padding:8px 10px;border-radius:9px;cursor:pointer;font-size:13.5px}
#searchResults .sr:hover{background:var(--blush2)}
#searchResults .sr small{display:block;color:var(--ink2)}
/* ---------- generic ---------- */
.tab{display:none;padding-top:22px;animation:fade .25s ease}
.tab.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--card-shadow)}
.card h3{font-size:17px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--ink2);margin-bottom:10px}
.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mauve);font-weight:700;margin-bottom:6px}
.stat .num{font-family:Georgia,serif;font-size:27px;color:var(--wine);line-height:1.1}
.stat .lbl{font-size:12px;color:var(--ink2);text-transform:uppercase;letter-spacing:1px}
.bar{height:9px;border-radius:99px;background:var(--sand);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--rose)}
.bar.gold i{background:#E2C6D2}
.bar.green i{background:#A9C29F}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.mut{color:var(--ink2);font-size:13px}
.small{font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--blush2);color:var(--wine);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.pill.rose{background:var(--blush)} .pill.sand{background:var(--sand)} .pill.red{background:#EEDCE6;color:var(--bad)} .pill.green{background:#E2EBDC;color:#4C6B47}
[data-theme="dark"] .pill.red{background:#4A2724} [data-theme="dark"] .pill.green{background:#2C3A28;color:#A9C29F}
.list{list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.list li:last-child{border-bottom:0}
.chk{width:21px;height:21px;border-radius:7px;border:2px solid var(--rose);background:var(--paper);flex:0 0 21px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;cursor:pointer;padding:0}
.chk.done{background:var(--mauve);border-color:var(--mauve)}
.done-t{text-decoration:line-through;opacity:.55}
.xbtn{background:none;border:0;color:var(--ink2);font-size:16px;line-height:1;padding:3px 6px;border-radius:6px}
.xbtn:hover{color:var(--bad);background:var(--blush2)}
.addrow{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.addrow input{flex:1;min-width:120px}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subtabs button{background:var(--paper);border:1.5px solid var(--line);color:var(--ink2);border-radius:999px;padding:7px 16px;font-size:13.5px;font-weight:600}
.subtabs button.on{background:var(--wine);color:#FBF4F8;border-color:var(--wine)}
.subpage{display:none}.subpage.on{display:block}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--mauve);padding:7px 8px;border-bottom:2px solid var(--line)}
table.tbl td{padding:8px;border-bottom:1px dashed var(--line);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:0}
.bars{display:flex;align-items:flex-end;gap:5px;height:110px;padding-top:8px}
.bars .b{flex:1;display:grid;grid-template-rows:auto 1fr auto;justify-items:center;gap:5px;min-width:0;height:100%}
.bars .b i{display:block;width:100%;max-width:30px;align-self:end;border-radius:6px 6px 3px 3px;background:var(--rose)}
.bars .b span{font-size:10.5px;color:var(--ink2);white-space:nowrap}
.bars .b b{font-size:11px;color:var(--wine)}
.ring{width:118px;height:118px;flex:0 0 118px}
.ring .track{stroke:var(--sand)} .ring .prog{stroke:var(--mauve);stroke-linecap:round}
.ring text{font-family:Georgia,serif}
.hero{background:var(--wine);border-radius:22px;color:#F7EEF3;padding:26px;position:relative;overflow:hidden;box-shadow:var(--card-shadow)}
.hero h2{color:#FBF4F8;font-size:27px}
.hero .mut{color:#E8D3DE}
.hero .orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.03);pointer-events:none}
input[type="date"],input[type="time"]{min-height:38px}
input[type="range"]{accent-color:var(--mauve)}
select{max-width:100%}
/* modal */
#modalWrap{position:fixed;inset:0;background:rgba(44,28,40,.45);backdrop-filter:blur(3px);display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:100}
#modalWrap.on{display:flex}
.modal{background:var(--paper);border-radius:20px;max-width:520px;width:100%;padding:24px;box-shadow:0 24px 60px rgba(0,0,0,.3);max-height:84vh;overflow:auto}
.modal h3{font-size:20px;margin-bottom:4px}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--mauve);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,80px);background:var(--wine);color:#FBF4F8;padding:11px 22px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.3s;z-index:200;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kcol{background:var(--blush2);border-radius:14px;padding:12px;min-height:120px}
[data-theme="dark"] .kcol{background:var(--sand)}
.kcol h4{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--wine);margin-bottom:9px}
.kcard{background:var(--paper);border:1.5px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;font-size:13px}
.kcard b{display:block;font-size:13.5px}
.kcard .mv{display:flex;gap:5px;margin-top:7px}
.kcard .mv button{flex:1;font-size:11px;padding:3px;border-radius:6px;border:1px solid var(--line);background:var(--blush2);color:var(--wine)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;text-align:center;color:var(--mauve);font-weight:700;text-transform:uppercase;padding:3px}
.cal .day{border:1.5px solid var(--line);border-radius:11px;min-height:64px;padding:6px;font-size:12px;background:var(--paper)}
.cal .day.off{opacity:.35}
.cal .day.today{border-color:var(--mauve);background:var(--blush2)}
.cal .day b{font-size:13px;color:var(--wine)}
.cal .day .ev{display:block;background:var(--blush);color:var(--wine);border-radius:5px;padding:1px 5px;margin-top:3px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .day .ev.task{background:var(--sand)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.weekcol{background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:11px;min-height:150px}
.weekcol h4{font-size:12.5px;color:var(--wine);margin-bottom:7px}
.weekcol.today{border-color:var(--mauve);background:var(--blush2)}
.tl{position:relative}
.tl .slot{display:flex;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--line);align-items:flex-start}
.tl .slot:last-child{border-bottom:0}
.tl .tm{flex:0 0 52px;font-weight:700;color:var(--mauve);font-size:13px;padding-top:1px}
.dotty{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:0 0 10px}
.glass{display:inline-flex;width:30px;height:38px;border:2px solid var(--rose);border-radius:5px 5px 11px 11px;cursor:pointer;position:relative;background:var(--paper)}
.glass i{position:absolute;left:0;right:0;bottom:0;background:#BFDCE8;border-radius:0 0 8px 8px;display:block}
.vision-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.vtile{border-radius:14px;padding:15px;min-height:104px;color:var(--wine);position:relative;overflow:hidden}
.vtile b{font-family:Georgia,serif;font-size:16px;display:block}
.vtile .bar{background:rgba(255,255,255,.55)} .vtile .bar i{background:var(--wine)}
.checkline{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.checkline:last-child{border:0}
.num-badge{min-width:27px;height:27px;border-radius:50%;background:var(--wine);color:#FBF4F8;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:0 0 27px}
@media(max-width:1080px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}.kanban{grid-template-columns:repeat(2,1fr)}.week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:820px){
#sidebar{position:fixed;left:0;top:0;transform:translateX(-105%);transition:.25s;width:262px;flex-basis:262px}
#sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
#hamb{display:flex}
#main{padding:0 15px 50px}
.g2,.g3,.g4{grid-template-columns:1fr}
.week{grid-template-columns:1fr}
.cal .day{min-height:52px}
header.top h1{font-size:20px}
.searchbox{display:none}
.vision-grid{grid-template-columns:1fr 1fr}
}


#tabBanner{position:relative;border-radius:20px;overflow:hidden;margin-top:20px;box-shadow:var(--card-shadow);border:1.5px solid var(--line)}
#tabBanner img{width:100%;height:190px;object-fit:cover;object-position:center;display:block}
#tabBanner .tb-shade{position:absolute;inset:0;background:rgba(54,32,50,.74)}
#tabBanner .tb-txt{position:absolute;left:22px;bottom:15px;color:#FBF4F8}
#tabBanner .tb-txt h2{color:#FBF4F8;font-size:26px;line-height:1.1}
#tabBanner .tb-txt p{font-size:13px;color:#ECDAE4}
@media(max-width:820px){#tabBanner img{height:128px}#tabBanner .tb-txt h2{font-size:20px}#tabBanner .tb-txt{left:15px;bottom:11px}}

/* ---------- photo desk hotspots ---------- */
.desk-photo{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--card-shadow);border:1.5px solid var(--line);line-height:0}
.desk-photo img{width:100%;height:auto;display:block}
.hotspot{position:absolute;transform:translate(-50%,-50%);background:none;border:0;display:flex;align-items:center;gap:6px;z-index:3;padding:4px}
.hotspot .dot{width:17px;height:17px;border-radius:50%;background:var(--wine);border:2.5px solid #FDF8FA;box-shadow:0 3px 10px rgba(54,32,50,.45);flex:0 0 17px;position:relative}
.hotspot .dot:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(91,53,87,.5);animation:pulse 2.6s ease-out infinite}
@keyframes pulse{0%{transform:scale(.55);opacity:.9}70%{transform:scale(1.15);opacity:0}100%{opacity:0}}
.hotspot .tag{background:rgba(253,249,251,.94);color:var(--wine);font-size:12px;font-weight:700;border-radius:999px;padding:4px 12px;box-shadow:0 4px 14px rgba(54,32,50,.25);white-space:nowrap;transition:.15s}
.hotspot:hover .tag{background:var(--wine);color:#FBF4F8}
.hotspot.flip{flex-direction:row-reverse}
@media(max-width:820px){.hotspot .tag{font-size:9.5px;padding:2.5px 8px}.hotspot .dot{width:13px;height:13px;flex-basis:13px}}

/* ---------- the desk (visual welcome) ---------- */
.desk-scene{position:relative;border-radius:22px;overflow:hidden;background:#F3E8EE;min-height:480px;box-shadow:var(--card-shadow);border:1.5px solid var(--line)}
[data-theme="dark"] .desk-scene{background:#3A2834}
.desk-window{position:absolute;top:34px;left:50%;transform:translateX(-50%);width:300px;height:180px;border-radius:14px;background:#FDF3E7;border:8px solid #FDF8FA;box-shadow:0 10px 30px rgba(91,53,87,.15)}
[data-theme="dark"] .desk-window{background:#4A3040;border-color:#4D3547}
.desk-window:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;background:#FDF8FA}
[data-theme="dark"] .desk-window:before{background:#4D3547}
.desk-window:after{content:"";position:absolute;top:50%;left:0;right:0;height:5px;background:#FDF8FA}
[data-theme="dark"] .desk-window:after{background:#4D3547}
.desk-sun{position:absolute;top:24px;left:36px;width:44px;height:44px;border-radius:50%;background:#F5C877}
.desk-obj{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;transition:.18s;z-index:3}
.desk-obj:hover{transform:translateY(-5px)}
.desk-obj .blob{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 10px 22px rgba(91,53,87,.28);border:2px solid rgba(255,255,255,.65)}
.desk-obj .blob svg{width:29px;height:29px}
.desk-obj .tag{background:rgba(255,252,253,.92);color:var(--wine);font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 11px;box-shadow:0 4px 12px rgba(91,53,87,.18);white-space:nowrap}
.desk-caption{position:absolute;left:0;right:0;bottom:0;padding:16px 22px;display:flex;align-items:flex-end;gap:14px;z-index:4}
.desk-caption h2{color:var(--wine);font-size:26px;text-shadow:0 1px 0 rgba(255,255,255,.35)}
.desk-caption p{color:#7A4A44;font-size:13.5px;max-width:520px}
[data-theme="dark"] .desk-caption p{color:#D9B4AC}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.floaty{animation:floaty 5s ease-in-out infinite}
@media(max-width:820px){
.desk-scene{min-height:0;padding:74px 14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.desk-window{width:210px;height:120px;top:16px}
.desk-obj{position:static!important;background:rgba(255,252,253,.75);border-radius:16px;padding:12px 6px}
[data-theme="dark"] .desk-obj{background:rgba(44,32,42,.8)}
.desk-obj .blob{width:50px;height:50px;border-radius:15px}
.desk-caption{position:static;grid-column:1/-1;padding:6px 2px 0}
}
@media print{
#sidebar,header.top,#toast,#modalWrap,.no-print,#tabBanner{display:none!important}
#main{padding:0} body{background:#fff}
.tab{display:none!important} .tab.on{display:block!important}
}

.logo-img{width:46px;height:46px;border-radius:13px;object-fit:cover;background:#FDF8FA;flex:0 0 46px}
#nav button{align-items:flex-start}
#nav button .nt{display:flex;flex-direction:column;min-width:0}
#nav button .nt b{font-weight:600;font-size:13.5px;line-height:1.25}
#nav button .nt small{font-size:10.5px;opacity:.65;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.navqa{padding:0 4px 10px}.navqa .qa{justify-content:center;background:var(--blush)!important;color:var(--wine)!important;font-weight:700}
.navlbl{font-size:10px;letter-spacing:1.6px;text-transform:uppercase;opacity:.6;margin:14px 12px 6px;color:#EEDFE8}
.mrib{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:0 6px}
#nav .mrib button{justify-content:center;padding:6px 0;font-size:11.5px;background:rgba(255,255,255,.08);margin:0}
#nav .mrib button:first-child,#nav .mrib button:last-child{grid-column:span 2}
@media(max-width:820px){
html,body{overflow-x:hidden}
#main{min-width:0;max-width:100vw}
.tab,.card{min-width:0;max-width:100%}
.card table{display:block;overflow-x:auto;white-space:nowrap}
.card{overflow-x:auto}
header.top{flex-wrap:nowrap;gap:8px}
header.top .ttl{min-width:0;flex:1}
header.top h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .btn.soft{font-size:0;padding:9px 12px}
header.top .btn.soft:after{content:"＋";font-size:16px}
.hotspot .tag{max-width:96px;overflow:hidden;text-overflow:ellipsis}
}
.hotspot{transform:translate(-12px,-50%)}.hotspot.flip{transform:translate(calc(-100% + 12px),-50%)}
@media(max-width:820px){.hotspot .tag{max-width:84px;font-size:9px}}

#tab-home .desk-photo{height:auto!important;aspect-ratio:1400/933}
#tab-home .desk-photo>img{height:100%!important;object-fit:fill!important}
.desk-photo>img{transition:filter .3s}
.desk-photo:has(.hotspot:hover)>img{filter:brightness(.82) saturate(1.05)}
.hotspot{transition:transform .2s}
.hotspot:hover{z-index:6}
.hotspot:hover .dot{transform:scale(1.25);box-shadow:0 0 0 6px rgba(226,198,210,.55),0 3px 10px rgba(54,32,50,.45)}
.hotspot:hover .tag{transform:scale(1.08)}
.desk-hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(91,53,87,.82);color:#FBF4F8;font-size:12px;line-height:1;padding:8px 14px;border-radius:999px;letter-spacing:.3px;pointer-events:none;white-space:nowrap}
.hubrow{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:16px}
.hubcard{display:flex;flex-direction:column;text-align:left;padding:0;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card,#fff);box-shadow:var(--card-shadow);transition:.2s;cursor:pointer;color:var(--ink)}
.hubcard:hover{transform:translateY(-4px)}
.hubcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;transition:transform .4s}
.hubcard:hover img{transform:scale(1.05)}
.hubcard span{padding:11px 14px 13px;display:flex;flex-direction:column;gap:2px}
.hubcard b{color:var(--wine);font-size:14px}.hubcard small{color:var(--ink2);font-size:12px}
@media(max-width:820px){.hubrow{grid-template-columns:1fr 1fr;gap:10px}.hubcard span{padding:8px 10px 10px}.hubcard b{font-size:12.5px}.hubcard small{font-size:10.5px}.desk-hint{font-size:10px;padding:6px 10px;bottom:8px}}
#accentCard{display:none!important}
.desk-photo:has(.hotspot:hover)>img{filter:brightness(.85)}
#themeBtn{display:none!important}
@media(max-width:820px){.desk-hint{display:none}}
@media(min-width:821px){#tab-home .desk-photo{width:min(100%,calc((100vh - 130px)*1.5));max-height:calc(100vh - 130px);margin:0 auto}}

header.top{gap:10px;flex-wrap:nowrap}
header.top .ttl{flex:0 1 auto;min-width:210px}
.tb-sp{flex:1}
.samplechip{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--rose);background:var(--blush2);border-radius:999px;padding:5px 6px 5px 14px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.samplechip b{color:var(--wine)}
.samplechip button{background:var(--wine);color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:700;font-size:12.5px}
.yearsel{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:0 10px;height:40px;color:var(--wine)}
.yearsel svg{width:16px;height:16px}.yearsel select{border:0;background:none;padding:0;font-weight:700;color:var(--wine);font-size:14px}
.tb-qa{background:var(--wine)!important;color:#fff!important;border-radius:12px!important;padding:10px 16px!important;font-weight:700;white-space:nowrap}
header.top .iconbtn{width:40px;height:40px;flex:0 0 40px;display:flex;align-items:center;justify-content:center;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--wine)}
header.top .iconbtn svg{width:18px;height:18px}
.bellwrap{position:relative}
#bellN{position:absolute;top:-5px;right:-5px;background:var(--wine);color:#fff;font-size:10px;font-weight:700;border-radius:999px;min-width:17px;height:17px;display:flex;align-items:center;justify-content:center;padding:0 4px}
#bellPanel{display:none;position:absolute;right:0;top:48px;width:320px;max-width:86vw;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;box-shadow:0 14px 40px rgba(91,53,87,.18);padding:14px;z-index:50}
#bellPanel.on{display:block}
.bitem{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px dashed var(--line);padding:9px 2px;font-size:13px;color:var(--ink)}
.bitem .dotty{margin-top:6px;flex:0 0 8px}
.desk-frame{background:#452041;border-radius:22px;padding:0;display:flex;justify-content:center;box-shadow:var(--card-shadow);overflow:hidden}
.desk-frame .desk-photo{border:0!important;box-shadow:none!important;border-radius:0!important}
.samplechip span{display:none}
@media(max-width:1440px){.searchbox{width:190px!important;min-width:0;flex:0 1 190px}}
@media(max-width:1250px){.searchbox{display:none!important}}
@media(max-width:1050px){.samplechip{display:none!important}.searchbox{display:none}}
@media(max-width:820px){.yearsel,header.top .tb-print{display:none!important}.tb-qa{font-size:0!important;padding:10px 13px!important}.tb-qa:after{content:"＋";font-size:16px}.desk-frame{border-radius:18px}}
#main{overflow-x:hidden}
#main>header.top,#main>#tabBanner,#main>#tabs{max-width:1240px;margin-left:auto;margin-right:auto}
@media(max-width:820px){header.top .ttl{min-width:0}}

#dBar{position:sticky;top:0;z-index:80;display:flex;align-items:center;justify-content:center;gap:12px;background:#5B3557;color:#FBF4F8;font-size:13px;padding:8px 14px;flex-wrap:wrap}
#dBar b{letter-spacing:1.4px;font-size:11.5px}
.dTrack{width:120px;height:7px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}.dTrack i{display:block;height:100%;width:0;background:#E2C6D2;transition:width .3s}
#dBar a{background:#E2C6D2;color:#5B3557;font-weight:700;border-radius:999px;padding:6px 14px;text-decoration:none}
#dWall{display:none;position:fixed;inset:0;z-index:200;background:rgba(54,32,50,.55);align-items:center;justify-content:center;padding:16px}#dWall.on{display:flex}
.dBox{background:#FFFCFD;border-radius:22px;max-width:440px;padding:28px;color:#3B2737;box-shadow:0 20px 60px rgba(54,32,50,.35)}
.dK{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:#8E6385;font-weight:700}
.dBox h3{font-family:Fraunces,Georgia,serif;color:#5B3557;font-size:22px;margin:8px 0 10px}.dBox p{font-size:14px;line-height:1.6;margin:0 0 18px}
.dBtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.dBtns button,.dBtns a{border-radius:12px;padding:10px 16px;font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.dBtns button{background:#F3E8EE;color:#5B3557;border:1.5px solid #E2C6D2}.dBtns a{background:#5B3557;color:#fff}
#sidebar{top:44px!important;height:calc(100vh - 44px)!important}#dBar{min-height:44px}
@media(max-width:820px){#sidebar{top:0!important;height:100vh!important}}
@media(max-width:600px){#dBar{font-size:11.5px;gap:8px}#dBar>span:nth-of-type(1){display:none}.dTrack{width:70px}}

const cur=()=>S.profile.currency||'$';
const money=n=>cur()+Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2});
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function dl(name,text,type){const b=new Blob([text],{type:type||'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},300)}
/* modal */
function openModal(html){$('#modalBox').innerHTML=html;$('#modalWrap').classList.add('on')}
function closeModal(){$('#modalWrap').classList.remove('on')}
$('#modalWrap').addEventListener('click',e=>{if(e.target.id==='modalWrap')closeModal()});
function fld(label,inner){return '<div class="fld"><label>'+label+'</label>'+inner+'</div>'}
function modalHead(t,sub){return '<h3>'+t+'</h3><p class="mut" style="margin-bottom:14px">'+(sub||'')+'</p>'}
function modalFoot(saveLabel,fn){return '<div class="row" style="margin-top:16px"><button class="btn grow" onclick="'+fn+'">'+saveLabel+'</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>'}

}
function jumpMonth(m){const n=new Date();const y=(typeof S!=='undefined'&&S.year)?+S.year:2027;monthOff=(y-n.getFullYear())*12+m-n.getMonth();go('month')}
function go(tab){
curTab=tab;
$$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
$$('.tab').forEach(t=>t.classList.remove('on'));
$('#tab-'+tab).classList.add('on');
const n=NAV.find(x=>x[0]===tab);
$('#pageTitle').textContent=n[1];
$('#pageSub').textContent=n[3];
$('#sidebar').classList.remove('open');
RENDER[tab]();
if(window.postGo)postGo(tab);
const BN=document.getElementById('tabBanner');
if(typeof BANNERS!=='undefined'&&BANNERS[tab]){BN.style.display='block';BN.innerHTML='<img src="'+BANNERS[tab]+'" alt=""><div class="tb-shade"></div><div class="tb-txt"><div class="kicker" style="color:var(--blush)">That Girl OS · 2027</div><h2>'+n[1]+'</h2><p>'+n[3]+'</p></div>'}else{BN.style.display='none';BN.innerHTML=''}
window.scrollTo({top:0,behavior:'smooth'});
}

$('#searchInput').addEventListener('input',e=>{
const q=e.target.value.trim().toLowerCase(),box=$('#searchResults');
if(q.length<2){box.style.display='none';return}
let hits=[];
SEARCHSRC.forEach(([key,label,fn])=>{fn().forEach(t=>{if(String(t).toLowerCase().includes(q))hits.push({label,t,tab:TABFOR[key]})})});

box.style.display='block';
});

function chkBtn(done,fn){return '<button class="chk '+(done?'done':'')+'" onclick="'+fn+'">'+(done?'✓':'')+'</button>'}
function delBtn(fn){return '<button class="xbtn" title="Delete" onclick="'+fn+'">×</button>'}
function streakOf(h){let n=0,off=0;if(!h.days[TODAY])off=1;while(h.days[dstr(-(off+n))])n++;return n}
function cycleInfo(){
const start=new Date(S.cycle.lastStart+'T12:00:00'),now=new Date(TODAY+'T12:00:00');
const diff=Math.floor((now-start)/86400000);
const day=((diff%S.cycle.len)+S.cycle.len)%S.cycle.len+1;
const ov=S.cycle.len-14;
let phase,advice;
if(day<=S.cycle.periodLen){phase='Menstrual';advice='Rest, warmth and low intensity. Be gentle with plans.'}
else if(day<ov-1){phase='Follicular';advice='Energy is rising — a good window for new starts and harder workouts.'}
else if(day<=ov+1){phase='Ovulation';advice='Confidence peak. Schedule the presentation, the date, the big ask.'}
else{phase='Luteal';advice='Calm focus. Finish things, nest, protect your evenings.'}
const next=new Date(start);next.setDate(next.getDate()+Math.ceil((diff+1)/S.cycle.len)*S.cycle.len);
const ovD=new Date(start);ovD.setDate(ovD.getDate()+(Math.floor(diff/S.cycle.len))*S.cycle.len+ov-1);
if(ovD<now)ovD.setDate(ovD.getDate()+S.cycle.len);
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
return {day,phase,advice,ov,next:iso(next),ovDate:iso(ovD),fertileStart:iso(new Date(ovD.getTime()-5*86400000)),fertileEnd:iso(new Date(ovD.getTime()+86400000))};
}
function reminders(){
const out=[];const inDays=s=>Math.round((new Date(s+'T12:00:00')-new Date(TODAY+'T12:00:00'))/86400000);

S.products.forEach(p=>{const d=inDays(p.expiry);if(d<=30)out.push({txt:'Product expires in '+d+'d: '+p.name,tab:'style',hot:d<10})});
S.debts.forEach(db=>{if(db.balance>0&&db.balance<=db.min*2)out.push({txt:'Almost there: '+db.name+' is down to '+money(db.balance),tab:'finance',hot:false})});
return out;
}

function debtFreeDate(){
const extra=+($('#extraPay')?.value||100);
let debts=S.debts.filter(d=>d.balance>0).map(d=>({...d}));
if(!debts.length)return 'Debt-free 🎉';
let months=0,freed=0;
while(debts.some(d=>d.balance>0)&&months<600){
months++;let pool=extra+freed;
debts.sort((a,b)=>a.balance-b.balance);
for(const d of debts){
if(d.balance<=0)continue;
const pay=Math.min(d.balance,d.min+pool);pool-=Math.max(0,pay-d.min);d.balance-=pay;
d.balance+=d.balance*(d.apr/100/12);
if(d.balance<1&&d.balance>0){freed+=d.min;d.balance=0}
if(d.balance<=0)freed+=d.min;
}
debts.forEach(d=>{if(d.balance>0)d.balance=Math.max(0,d.balance)});
if(debts.every(d=>d.balance<=0))break;
}
if(months>=600)return '—';
const dt=new Date();dt.setMonth(dt.getMonth()+months);
return dt.toLocaleDateString('en-GB',{month:'short',year:'numeric'})+' ('+months+' mo)';
}

/* ================= HOME EXTRAS (visual richness) ================= */
function sleepDur(s){const[hb,mb]=s.bed.split(':').map(Number),[hw,mw]=s.wake.split(':').map(Number);let m=(hw*60+mw)-(hb*60+mb);if(m<0)m+=1440;return m/60}
function homeExtras(){
const now=new Date(),y=now.getFullYear(),mo=now.getMonth();
const first=new Date(y,mo,1),startDay=(first.getDay()+6)%7,daysIn=new Date(y,mo+1,0).getDate();
let cells='';for(let i=0;i<startDay;i++)cells+='<div></div>';
for(let d=1;d<=daysIn;d++){const ds=y+'-'+pad(mo+1)+'-'+pad(d);const has=(S.tasks[ds]||[]).length;cells+='<div style="text-align:center;padding:4px 0;border-radius:9px;font-size:12.5px;'+(ds===TODAY?'background:var(--wine);color:#FBF4F8;font-weight:700':'')+'">'+d+(has&&ds!==TODAY?'<span style="display:block;width:5px;height:5px;border-radius:50%;background:var(--rose);margin:1px auto 0"></span>':'')+'</div>'}
const spark=[...Array(14)].map((_,i)=>S.txns.filter(t=>t.date===dstr(i-13)).reduce((a,t)=>a+t.amt,0));
const mx=Math.max(...spark,10);
const pts=spark.map((v,i)=>((i/(spark.length-1))*100)+','+(34-(v/mx)*30)).join(' ');
const sleepBars=[-6,-5,-4,-3,-2,-1,0].map(o=>{const s=S.sleep.find(x=>x.date===dstr(o));const v=s?sleepDur(s):0;return '<div class="b"><b>'+(v?v.toFixed(1):'')+'</b><i style="height:'+Math.max(3,v/9*100)+'%"></i><span>'+['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(dstr(o)+'T12:00:00').getDay()]+'</span></div>'}).join('');
const focusBars=[-6,-5,-4,-3,-2,-1,0].map(o=>{const m=S.workouts.filter(w=>w.date===dstr(o)).reduce((a,w)=>a+w.mins,0);return '<div class="b"><b>'+(m||'')+'</b><i style="height:'+Math.max(3,m/60*100)+'%"></i><span>'+['Su','Mo','Tu','We','Th','Fr','Sa'][new Date(dstr(o)+'T12:00:00').getDay()]+'</span></div>'}).join('');
return '<div class="grid g3" style="margin-top:16px">'+

<style>
#tab-today .subtabs,#tab-week .subtabs,#tab-year .subtabs{display:none}
#tab-home .desk-photo{height:540px;border-radius:22px;box-shadow:var(--card-shadow)}
#tab-home .desk-photo>img{height:100%;object-fit:cover;object-position:center 65%}
@media(max-width:820px){#tab-home .desk-photo{height:300px}}
.g90{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.g90 button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;font-size:10px;color:var(--ink2);padding:0}
.g90 button.done{background:var(--wine);color:#FCF6F9;border-color:var(--wine)}
.g90 button.today{outline:2px solid var(--gold);outline-offset:1px}
.vboard{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:820px){.vboard{grid-template-columns:repeat(2,1fr)}}
.vtile{border-radius:14px;overflow:hidden;position:relative;min-height:118px;background:var(--blush2)}
.vtile img.ph{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.vtile .vc{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 8px;background:rgba(54,32,50,.78);color:#FCF6F9;font-size:12px;line-height:1.3}
.vtile .vc small{display:block;opacity:.85;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}
.vtile input[type=range]{width:100%;margin-top:5px}
.swrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px}
.sw{width:46px;height:46px;border-radius:50%;border:3px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--wine);transform:scale(1.08)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.mcell{min-height:62px;border:1.5px solid var(--line);border-radius:10px;padding:6px;font-size:12px;background:var(--paper);cursor:pointer;text-align:left}
.mcell.dim{opacity:.38}
.mcell.today{border-color:var(--wine);box-shadow:0 0 0 1px var(--wine)}
.mdot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--wine);margin:2px 3px 0 0}
.baphoto{border:2px dashed var(--line);border-radius:14px;min-height:150px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:var(--blush2)}
.baphoto img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.baphoto label{cursor:pointer;text-align:center;padding:18px;color:var(--ink2);font-size:13px;z-index:1}
@media(max-width:820px){.desk-hint{display:none}}
@media(min-width:821px){#tab-home .desk-photo{width:min(100%,calc((100vh - 130px)*1.5));max-height:calc(100vh - 130px);margin:0 auto}}
#main{overflow-x:hidden}
#main>header.top,#main>#tabBanner,#main>#tabs{max-width:1240px;margin-left:auto;margin-right:auto}
@media(max-width:820px){header.top .ttl{min-width:0}}
</style>


<script>
function ensureNew(){
if(!S.glow)S.glow={start:TODAY,days:{},before:'',after:'',note:''};
if(!S.wishlist)S.wishlist=[{id:uid(),t:'Linen blazer',price:120,pr:'High',got:false},{id:uid(),t:'Silk scarf',price:45,pr:'Low',got:false},{id:uid(),t:'Weekend flights — Lisbon',price:260,pr:'High',got:false},{id:uid(),t:'Hardcover journal',price:28,pr:'Medium',got:true}];
if(S.letter===undefined)S.letter='';
if(!S.accent)S.accent='blush';
}
function glowScore(){
ensureNew();
const parts=[];
if(S.habits.length)parts.push(S.habits.filter(x=>x.days&&x.days[TODAY]).length/S.habits.length);
if(S.water&&S.water.goal)parts.push(Math.min(1,(S.water.glasses||0)/S.water.goal));
const pr=S.priorities||[]; if(pr.length)parts.push(pr.filter(p=>p.done).length/pr.length);
const sc=S.schedule||[]; if(sc.length)parts.push(sc.filter(s=>s.done).length/sc.length);
return parts.length?Math.round(parts.reduce((a,b)=>a+b,0)/parts.length*100):0;
}
function downscale(file,cb){
const r=new FileReader();
r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const sc=Math.min(1,900/img.width);c.width=img.width*sc;c.height=img.height*sc;c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',0.78))};img.src=e.target.result};
r.readAsDataURL(file);
}
/* ---------- MONTH ---------- */
let monthOff=0;
function renderMonth(){
const el=$('#tab-month');
const base=new Date(); base.setDate(1); base.setMonth(base.getMonth()+monthOff);
const y=base.getFullYear(),m=base.getMonth();
const first=new Date(y,m,1); let startDay=(first.getDay()+6)%7;
const dim=new Date(y,m+1,0).getDate(), pdim=new Date(y,m,0).getDate();
const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
let cells='';
for(let i=0;i<42;i++){
const dnum=i-startDay+1; let dt,dim2=false;
if(dnum<1){dt=new Date(y,m-1,pdim+dnum);dim2=true}
else if(dnum>dim){dt=new Date(y,m+1,dnum-dim);dim2=true}
else dt=new Date(y,m,dnum);
const ds=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
const n=(S.tasks[ds]||[]).length;
cells+='<button class="mcell'+(dim2?' dim':'')+(ds===TODAY?' today':'')+'" onclick="planDate=\''+ds+'\';go(\'today\')"><b>'+dt.getDate()+'</b><br>'+(n?'<span class="mdot"></span>'.repeat(Math.min(n,4))+'<small>'+n+' planned</small>':'')+'</button>';
if(i>34&&dt.getDate()<=7&&dnum>dim)break;
}
el.innerHTML='<div class="card"><div class="row wrap" style="justify-content:space-between;align-items:center"><div><div class="kicker">Month view</div><h3 style="font-family:var(--serif);font-size:24px">'+names[m]+' '+y+'</h3></div><div class="row"><button class="btn soft sm" onclick="monthOff--;renderMonth()">‹ Prev</button><button class="btn soft sm" onclick="monthOff=0;renderMonth()">This month</button><button class="btn soft sm" onclick="monthOff++;renderMonth()">Next ›</button></div></div>'+
'<div class="mgrid" style="margin-top:14px">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div style="font-size:11px;letter-spacing:1.5px;color:var(--ink2);text-align:center">'+d.toUpperCase()+'</div>').join('')+'</div>'+
'<div class="mgrid" style="margin-top:6px">'+cells+'</div>'+
'<p class="hint" style="margin-top:12px">Tap any day to open it in Today and plan it properly.</p></div>';
}
/* ---------- GOALS & VISION ---------- */
const VG=['#EEDCE6','#E9D8C8','#DCE8D2','#E4D7F2','#E2C6D2','#F0E3C8'];
function visPhoto(inp){ if(!inp.files||!inp.files[0])return; downscale(inp.files[0],u=>{S.vision.unshift({id:uid(),t:'My own photo',cat:'Vision',progress:0,c:0,photo:u});save();renderGoals();}); }
function renderGoals(){
ensureNew();
const el=$('#tab-goals');
const tiles=S.vision.map((v,i)=>'<div class="vtile" style="background:'+(v.photo?'var(--blush2)':VG[v.c%VG.length])+'">'+(v.photo?'<img class="ph" src="'+v.photo+'">':'')+'<div class="vc"><small>'+esc(v.cat||'Dream')+'</small>'+esc(v.t)+'<input type="range" min="0" max="100" value="'+(v.progress||0)+'" onchange="S.vision['+i+'].progress=+this.value;save();renderGoals()"><span style="font-size:11px">'+(v.progress||0)+'% of the way</span></div></div>').join('');
const goals=S.yearGoals.map((g,i)=>'<div style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><span><b>'+esc(g.t)+'</b> <span class="pill">'+esc(g.area)+'</span></span><b>'+g.progress+'%</b></div><input type="range" min="0" max="100" value="'+g.progress+'" style="width:100%" onchange="S.yearGoals['+i+'].progress=+this.value;save();renderGoals()"></div>').join('');
const bucket=(S.bucket||[]).map(b=>'<span class="pill" style="margin:0 6px 6px 0;'+(b.done?'opacity:.55;text-decoration:line-through':'')+'">'+esc(b.t)+'</span>').join('');
el.innerHTML='<div class="card"><div class="kicker">Vision board · up to 12 photos</div><p class="hint">See it every day. Add your own photos, or keep the dream tiles — drag the sliders as you get closer.</p><div class="vboard">'+tiles+'</div>'+
'<div class="row wrap" style="margin-top:14px"><label class="btn soft sm" style="cursor:pointer">+ Add a photo<input type="file" accept="image/*" hidden onchange="visPhoto(this)"></label><input id="newVis" placeholder="New dream — e.g. A studio of my own" style="flex:1;min-width:180px"><button class="btn sm" onclick="addVision()">Add dream</button></div></div>'+
'<div class="grid g2" style="margin-top:16px"><div class="card"><div class="kicker">Goals & action steps</div>'+goals+'</div>'+
'<div class="card"><div class="kicker">Mood board · the feeling</div><div class="row" style="gap:8px;margin:6px 0 14px">'+['#E2C6D2','#E9DCE3','#C49DB4','#8E6385','#5B3557','#A87E9C'].map(c=>'<span style="width:34px;height:34px;border-radius:50%;background:'+c+';display:inline-block"></span>').join('')+'</div><div class="kicker">Bucket list</div><div>'+bucket+'</div></div></div>';
}
function addVision(){const v=$('#newVis').value.trim();if(!v)return;S.vision.unshift({id:uid(),t:v,cat:'Dream',progress:0,c:S.vision.length%6});save();renderGoals()}
/* ---------- HABITS & ROUTINES ---------- */
function streakOf(hb){let s=0;for(let i=0;i<365;i++){if(hb.days&&hb.days[dstr(-i)])s++;else if(i>0)break;else break}return s}
function renderHabits(){
const el=$('#tab-habits');
const days=[];for(let i=13;i>=0;i--)days.push(dstr(-i));
const grid=S.habits.map((hb,hi)=>'<tr><td style="text-align:left"><b>'+esc(hb.name)+'</b><br><small style="color:var(--ink2)">'+streakOf(hb)+' day streak</small></td>'+days.map(d=>'<td>'+(hb.days&&hb.days[d]?'<span style="color:var(--wine);font-weight:700">●</span>':'<span style="opacity:.25">○</span>')+'</td>').join('')+'</tr>').join('');
const todayList=S.habits.map((hb,hi)=>'<div class="checkline">'+chkBtn(!!(hb.days&&hb.days[TODAY]),"togHabit("+hi+")")+'<span class="grow'+(hb.days&&hb.days[TODAY]?' done-t':'')+'">'+esc(hb.name)+'</span></div>').join('');
const rout=(arr,ix)=>arr.map((r,i)=>'<div class="checkline">'+chkBtn(r.done,"togRoutine('"+ix+"',"+i+")")+'<span class="grow'+(r.done?' done-t':'')+'">'+esc(r.t)+'</span></div>').join('');
el.innerHTML='<div class="grid g2"><div class="card"><div class="kicker">Today\'s habits</div>'+todayList+'<div class="addrow"><input id="newHab" placeholder="New habit — e.g. Read 10 pages"><button class="btn sm" onclick="addHabit()">Add</button></div></div>'+
'<div class="card"><div class="kicker">Routines</div><h4 style="margin:8px 0 4px">Morning</h4>'+rout(S.routines.am,'am')+'<h4 style="margin:14px 0 4px">Evening</h4>'+rout(S.routines.pm,'pm')+'</div></div>'+
'<div class="card" style="margin-top:16px"><div class="kicker">Last 14 days</div><div style="overflow:auto"><table class="tbl"><tr><th style="text-align:left">Habit</th>'+days.map(d=>'<th>'+d.slice(8)+'</th>').join('')+'</tr>'+grid+'</table></div></div>';
}
function togHabit(i){const hb=S.habits[i];hb.days=hb.days||{};if(hb.days[TODAY])delete hb.days[TODAY];else hb.days[TODAY]=1;save();renderHabits()}
function togRoutine(w,i){S.routines[w][i].done=!S.routines[w][i].done;save();renderHabits()}
function addHabit(){const v=$('#newHab').value.trim();if(!v)return;S.habits.push({id:uid(),name:v,days:{}});save();renderHabits()}
/* ---------- GLOW UP ---------- */
function glowPhoto(which,inp){ if(!inp.files||!inp.files[0])return; downscale(inp.files[0],u=>{ensureNew();S.glow[which]=u;save();renderGlowUp();}); }
function renderGlowUp(){
ensureNew();
const el=$('#tab-glowup');
const start=S.glow.start||TODAY;
const dayN=Math.max(1,Math.min(90,Math.floor((Date.parse(TODAY)-Date.parse(start))/86400000)+1));
const doneN=Object.keys(S.glow.days).length;
let cells='';for(let n=1;n<=90;n++){cells+='<button class="'+(S.glow.days[n]?'done':'')+(n===dayN?' today':'')+'" onclick="togGlowDay('+n+')">'+n+'</button>'}
const skin=(arr,ix)=>arr.map((r,i)=>'<div class="checkline">'+chkBtn(r.done,"togSkin('"+ix+"',"+i+")")+'<span class="grow'+(r.done?' done-t':'')+'">'+esc(r.t)+'</span></div>').join('');
el.innerHTML='<div class="grid g3"><div class="card stat"><div class="kicker">Challenge day</div><div class="bignum">'+dayN+' <small>/ 90</small></div></div><div class="card stat"><div class="kicker">Days completed</div><div class="bignum">'+doneN+'</div></div><div class="card stat"><div class="kicker">Today\'s glow score</div><div class="bignum">'+glowScore()+'<small>%</small></div></div></div>'+
'<div class="card" style="margin-top:16px"><div class="kicker">90-day glow-up challenge</div><p class="hint">One small glow ritual a day. Tap a day when it is done — no perfection, just proof.</p><div class="g90">'+cells+'</div><div class="row wrap" style="margin-top:14px"><span class="hint">Challenge starts</span><input type="date" value="'+start+'" onchange="S.glow.start=this.value;save();renderGlowUp()"></div></div>'+
'<div class="grid g2" style="margin-top:16px"><div class="card"><div class="kicker">AM skincare</div>'+skin(S.skin.am,'am')+'<div class="kicker" style="margin-top:16px">PM skincare</div>'+skin(S.skin.pm,'pm')+'</div>'+
'<div class="card"><div class="kicker">Before / after</div><div class="grid g2"><div class="baphoto">'+(S.glow.before?'<img src="'+S.glow.before+'">':'')+'<label>Before<br><small>add a photo</small><input type="file" accept="image/*" hidden onchange="glowPhoto(\'before\',this)"></label></div><div class="baphoto">'+(S.glow.after?'<img src="'+S.glow.after+'">':'')+'<label>After<br><small>add a photo</small><input type="file" accept="image/*" hidden onchange="glowPhoto(\'after\',this)"></label></div></div><div class="kicker" style="margin-top:16px">What is changing</div><textarea rows="3" style="width:100%" placeholder="Skin, energy, confidence…" onchange="S.glow.note=this.value;save()">'+esc(S.glow.note||'')+'</textarea></div></div>';
}
function togGlowDay(n){ensureNew();if(S.glow.days[n])delete S.glow.days[n];else S.glow.days[n]=1;save();renderGlowUp()}
function togSkin(w,i){S.skin[w][i].done=!S.skin[w][i].done;save();renderGlowUp()}
/* ---------- MEALS & GROCERIES ---------- */
function renderMeals(){
const el=$('#tab-meals');
const rows=S.meals.days.map(d=>'<tr><td><b>'+d+'</b></td>'+['b','l','d'].map(k=>'<td><input value="'+esc(S.meals.plan[d][k])+'" onchange="editMeal(\''+d+'\',\''+k+'\',this.value)" style="width:100%;border:0;background:transparent;padding:2px"></td>').join('')+'</tr>').join('');
const gro=S.grocery.map((g,i)=>'<div class="checkline">'+chkBtn(g.done,"togGroM("+i+")")+'<span class="grow'+(g.done?' done-t':'')+'">'+esc(g.t)+'</span>'+delBtn("delGroM("+i+")")+'</div>').join('');
el.innerHTML='<div class="card"><div class="kicker">Weekly meal plan</div><p class="hint">Edit any cell — it saves as you type, and the same plan shows in Wellness.</p><div style="overflow:auto"><table class="tbl"><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Dinner</th></tr>'+rows+'</table></div></div>'+
'<div class="card" style="margin-top:16px"><div class="kicker">Grocery list</div>'+gro+'<div class="addrow"><input id="newGroM" placeholder="Add an item…"><button class="btn sm" onclick="addGroM()">Add</button><button class="btn soft sm" onclick="genGrocery();renderMeals()">Build from plan</button></div></div>';
}
function addGroM(){const v=$('#newGroM').value.trim();if(!v)return;S.grocery.push({id:uid(),t:v,done:false});save();renderMeals()}
function togGroM(i){S.grocery[i].done=!S.grocery[i].done;save();renderMeals()}
function delGroM(i){S.grocery.splice(i,1);save();renderMeals()}
/* ---------- JOURNAL & GRATITUDE ---------- */
function renderJournal(){
const el=$('#tab-journal');
const g=S.gratitude[TODAY]||[];
const entries=S.journal.map((j,i)=>'<div class="card" style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>'+esc(j.title)+'</b><small style="color:var(--ink2)">'+j.date+' · mood '+j.mood+'/5</small></div><p style="margin-top:6px">'+esc(j.body)+'</p></div>').join('');
el.innerHTML='<div class="grid g2"><div class="card"><div class="kicker">Gratitude · today</div>'+(g.map(x=>'<div class="checkline"><span style="color:var(--wine)">✦</span><span class="grow">'+esc(x)+'</span></div>').join('')||'<p class="hint">Nothing yet today.</p>')+'<div class="addrow"><input id="newGrat" placeholder="One good thing…"><button class="btn sm" onclick="addGrat()">Add</button></div>'+
'<div class="kicker" style="margin-top:20px">A letter to future me</div><textarea id="letterBox" rows="6" style="width:100%" placeholder="Dear future me…">'+esc(S.letter||'')+'</textarea><button class="btn soft sm" style="margin-top:8px" onclick="S.letter=$(\'#letterBox\').value;save();toast(\'Letter saved\')">Save the letter</button></div>'+
'<div class="card"><div class="kicker">New entry</div><input id="jTitle" placeholder="Title" style="width:100%;margin-bottom:8px"><textarea id="jBody" rows="4" style="width:100%" placeholder="Today I noticed…"></textarea><div class="row" style="margin-top:8px"><select id="jMood"><option value="5">Mood 5 · glowing</option><option value="4">Mood 4 · good</option><option value="3" selected>Mood 3 · okay</option><option value="2">Mood 2 · low</option><option value="1">Mood 1 · hard</option></select><button class="btn sm" onclick="addJournal()">Save entry</button></div></div></div>'+
'<div style="margin-top:16px">'+entries+'</div>';
}
function addGrat(){const v=$('#newGrat').value.trim();if(!v)return;(S.gratitude[TODAY]=S.gratitude[TODAY]||[]).push(v);save();renderJournal()}
function addJournal(){const t=$('#jTitle').value.trim(),b=$('#jBody').value.trim();if(!t&&!b)return;S.journal.unshift({id:uid(),date:TODAY,title:t||'Untitled',mood:+$('#jMood').value,body:b});save();renderJournal()}
/* ---------- WISHLIST ---------- */
function renderWishlist(){
ensureNew();
const el=$('#tab-wishlist');
const left=S.wishlist.filter(w=>!w.got).reduce((a,w)=>a+(+w.price||0),0);
const rows=S.wishlist.map((w,i)=>'<div class="checkline">'+chkBtn(w.got,"togWish("+i+")")+'<span class="grow'+(w.got?' done-t':'')+'"><b>'+esc(w.t)+'</b> · '+cur()+(+w.price||0)+' <span class="pill">'+esc(w.pr)+'</span></span>'+delBtn("delWish("+i+")")+'</div>').join('');
el.innerHTML='<div class="grid g3"><div class="card stat"><div class="kicker">Still to save</div><div class="bignum">'+cur()+left+'</div></div><div class="card stat"><div class="kicker">Wishes</div><div class="bignum">'+S.wishlist.length+'</div></div><div class="card stat"><div class="kicker">Made real</div><div class="bignum">'+S.wishlist.filter(w=>w.got).length+'</div></div></div>'+
'<div class="card" style="margin-top:16px"><div class="kicker">The wishlist</div>'+rows+'<div class="addrow"><input id="wName" placeholder="Something beautiful…" style="flex:2"><input id="wPrice" type="number" placeholder="Price" style="flex:1"><select id="wPr"><option>High</option><option selected>Medium</option><option>Low</option></select><button class="btn sm" onclick="addWish()">Add</button></div><p class="hint" style="margin-top:10px">Tick a wish when it becomes real — it stays here as proof your plans turn into things.</p></div>';
}
function addWish(){const t=$('#wName').value.trim();if(!t)return;S.wishlist.unshift({id:uid(),t:t,price:+$('#wPrice').value||0,pr:$('#wPr').value,got:false});save();renderWishlist()}
function togWish(i){S.wishlist[i].got=!S.wishlist[i].got;save();renderWishlist()}
function delWish(i){S.wishlist.splice(i,1);save();renderWishlist()}
/* ---------- post-render hooks ---------- */
function setAccent(a){ensureNew();S.accent=a;save();document.documentElement.dataset.accent=a;renderSettings();if(window.postGo)postGo('settings')}
const ACCENTS=[['blush','Blush','#E2C6D2','#5B3557'],['latte','Latte','#EBD9BE','#5C3A21'],['sage','Sage','#D7E5C6','#38512F'],['lilac','Lilac','#DECFEF','#452A63'],['cherry','Cherry','#E2C6D2','#6E0F2C']];
window.postGo=function(tab){
ensureNew();
document.documentElement.dataset.accent='blush';
if(tab==='home'){
if(!document.getElementById('tab-desk')){const tmp=document.createElement('section');tmp.id='tab-desk';tmp.style.display='none';document.body.appendChild(tmp)}
renderDesk();
const dp=$('#tab-desk .desk-photo'),home=$('#tab-home');
if(dp&&home&&!home.querySelector('.desk-photo'))home.prepend(dp);
if(home&&!home.querySelector('#glowCard')){
const sc=glowScore();
const card=document.createElement('div');card.id='glowCard';card.className='card';card.style.marginBottom='16px';
card.innerHTML='<div class="row" style="justify-content:space-between;align-items:center"><div><div class="kicker">Today\'s glow score</div><div style="font-family:var(--serif);font-size:30px;color:var(--wine)">'+sc+'% <small style="display:block;font-family:var(--sans,inherit);font-size:13px;line-height:1.4;color:var(--ink2)">Habits, water, top 3 & schedule, glowing together</small></div></div><button class="btn soft sm" onclick="go(\'glowup\')">Open Glow Up</button></div><div class="bar" style="margin-top:10px"><i style="width:'+sc+'%"></i></div>';
const anchor=home.querySelector('.desk-photo'); if(anchor)anchor.after(card); else home.prepend(card);
}
}
if(tab==='settings'){
const st=$('#tab-settings');
if(st&&!st.querySelector('#accentCard')){
const card=document.createElement('div');card.id='accentCard';card.className='card';card.style.marginTop='16px';
card.innerHTML='<div class="kicker">Accent themes</div><p class="hint">Five moods, one planner. Pick the one that feels like you today — light mode wears it best.</p><div class="swrow">'+ACCENTS.map(a=>'<span style="text-align:center"><button class="sw'+(S.accent===a[0]?' on':'')+'" style="background:transparent" onclick="setAccent(\''+a[0]+'\')"></button><br><small>'+a[1]+'</small></span>').join('')+'</div>';
st.appendChild(card);
}
}
};
